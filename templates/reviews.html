<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы о рецептах</title>
    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
                border-radius: 15px;
            }
            h1 {
                font-size: 1.5em;
            }
            .btn-submit {
                font-size: 16px;
                padding: 12px;
            }
        }

        .nav-link {
            text-align: left;
            margin-bottom: 15px;
        }
        .nav-link a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
        }

        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #444;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            margin-bottom: 15px;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #6c63ff;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #4834d4);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.4);
        }

        .review-card {
            background: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
            border-left: 5px solid #00b894;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .review-author {
            font-weight: bold;
            color: #2d3436;
            display: block;
            margin-bottom: 5px;
        }

        .review-text {
            color: #636e72;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-link">
            <a href="/">⬅ Вернуться на главную</a>
        </div>
        
        <h1>💬 Отзывы пользователей</h1>

        <form method="post">
            <label>Ваше имя:</label>
            <input type="text" name="author" placeholder="Как вас зовут?" required>

            <label>Ваш отзыв:</label>
            <textarea name="content" rows="4" placeholder="Поделитесь впечатлениями о рецептах..." required></textarea>

            <button type="submit" class="btn-submit">Оставить отзыв</button>
        </form>

        <div class="results-area">
            {% if reviews %}
                <h2 style="margin-top: 30px;">Что говорят другие:</h2>
                {% for review in reviews %}
                    <div class="review-card">
                        <span class="review-author">👤 {{ review.author }}</span>
                        <p class="review-text">{{ review.content }}</p>
                    </div>
                {% endfor %}
            {% else %}
                <p style="text-align: center; margin-top: 30px; color: #b2bec3;">Пока отзывов нет. Будьте первым!</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
